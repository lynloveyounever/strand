services:
  strand-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - strand-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  strand-data:
